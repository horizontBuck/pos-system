<!-- Sidebar -->
<div class="sidebar" id="sidebar">
  <!-- Logo -->
  <div class="sidebar-logo active">
    <a routerLink="/" class="logo logo-normal">
      <img src="assets/img/logo.png" alt="Img">
    </a>
    <a id="toggle_btn" href="javascript:void(0);">
      <i data-feather="chevrons-left" class="feather-16"></i>
    </a>
  </div>
  <!-- /Logo -->

  <!-- Perfil -->
  <div class="modern-profile p-3 pb-0">
    <div class="text-center rounded bg-light p-3 mb-4 user-profile">
      <div class="avatar avatar-lg online mb-3">
        <img [src]="avatarUrl" alt="Img" class="img-fluid rounded-circle">
      </div>
      <h6 class="fs-14 fw-bold mb-1">{{ userName }}</h6>
      <p class="fs-12 mb-0 text-capitalize">{{ userRole }}</p>
    </div>
  </div>

  <!-- Menú -->
  <div class="sidebar-inner slimscroll">
    <div id="sidebar-menu" class="sidebar-menu">
      <ul>
        <li class="submenu-open" *ngFor="let section of menuSections">
          <h6 class="submenu-hdr">{{ section.title }}</h6>
          <ul>
            <li class="submenu" *ngFor="let item of section.items">
              <!-- Si no tiene hijos -->
              <a *ngIf="!item.children" [routerLink]="item.route" routerLinkActive="active">
                <i [class]="item.icon + ' fs-16 me-2'"></i>
                <span>{{ item.label }}</span>
              </a>

              <!-- Si tiene hijos -->
              <div *ngIf="item.children" class="submenu">
                <a href="javascript:void(0);">
                  <i [class]="item.icon + ' fs-16 me-2'"></i>
                  <span>{{ item.label }}</span>
                  <span class="menu-arrow"></span>
                </a>
                <ul>
                  <li *ngFor="let sub of item.children">
                    <a [routerLink]="sub.route" routerLinkActive="active">{{ sub.label }}</a>
                  </li>
                </ul>
              </div>
            </li>
          </ul>
        </li>

        <li>
          <a href="javascript:void(0)" (click)="logout()">
            <i class="ti ti-logout fs-16 me-2"></i>
            <span>Salir</span>
          </a>
        </li>
      </ul>
    </div>
  </div>
</div>
<!-- /Sidebar -->
