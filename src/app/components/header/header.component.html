<header class="crm-header bg-white border-bottom py-2 px-3 d-flex align-items-center justify-content-between">

  <!-- LOGO + EMPRESA -->
  <div class="d-flex align-items-center gap-2">
    <img src="assets/img/logo.png" alt="logo" style="height: 36px;">
    <div>
      <h6 class="mb-0 fw-bold">{{ companyName || 'Cargando...' }}</h6>
      <small class="text-muted">CRM Multiempresa</small>
    </div>
  </div>

  <!-- BUSCADOR -->
  <div class="d-flex align-items-center flex-grow-1 mx-4">
    <div class="input-group w-100" style="max-width: 400px;">
      <span class="input-group-text bg-light border-end-0"><i class="ti ti-search"></i></span>
      <input type="text"
             class="form-control border-start-0"
             placeholder="Buscar cliente, proyecto o tarea..."
             [(ngModel)]="searchTerm"
             (keyup.enter)="searchGlobal()" />
    </div>
  </div>

  <!-- ACCIONES RÁPIDAS -->
  <div class="d-flex align-items-center gap-3">
    <div class="dropdown">
      <button class="btn btn-primary dropdown-toggle d-flex align-items-center" data-bs-toggle="dropdown">
        <i class="ti ti-circle-plus me-1"></i>Agregar
      </button>
      <ul class="dropdown-menu dropdown-menu-end shadow-sm">
        <li><a class="dropdown-item" (click)="goTo('/clients')"><i class="ti ti-user me-2"></i>Nuevo cliente</a></li>
        <li><a class="dropdown-item" (click)="goTo('/cases')"><i class="ti ti-briefcase me-2"></i>Nuevo caso</a></li>
        <li><a class="dropdown-item" (click)="goTo('/tasks/create')"><i class="ti ti-checklist me-2"></i>Nueva tarea</a></li>
      </ul>
    </div>

    <!-- PERFIL -->
    <div class="dropdown">
      <a class="d-flex align-items-center text-decoration-none" data-bs-toggle="dropdown">
        <img [src]="avatarUrl" class="rounded-circle me-2" style="width: 32px; height: 32px;">
        <span>{{ userName || 'Usuario' }}</span>
      </a>
      <ul class="dropdown-menu dropdown-menu-end shadow-sm">
        <li><a class="dropdown-item" (click)="goTo('/profile')"><i class="ti ti-user-circle me-2"></i>Mi perfil</a></li>
        <li><a class="dropdown-item text-danger" (click)="logout()"><i class="ti ti-logout me-2"></i>Cerrar sesión</a></li>
      </ul>
    </div>
  </div>
</header>
